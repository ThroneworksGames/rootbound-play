<script>
// iPhone sound: play even with the silent switch on, and wake the game's audio on every tap
// (iOS only lets sound start from a finished tap, and pauses it when the app is put away).
(function () {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  var ctxs = [];
  ['AudioContext', 'webkitAudioContext'].forEach(function (k) {
    var O = window[k];
    if (!O) return;
    var W = function (a) { var c = new O(a); ctxs.push(c); return c; };
    W.prototype = O.prototype;
    window[k] = W;
  });
  function wake() {
    ctxs.forEach(function (c) {
      if (c.state !== 'running' && c.state !== 'closed') {
        try {
          c.resume();
          var src = c.createBufferSource();
          src.buffer = c.createBuffer(1, 1, 22050);
          src.connect(c.destination);
          src.start(0);
        } catch (e) {}
      }
    });
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (t) { document.addEventListener(t, wake, true); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });
})();
</script>
<script>
// F11 (and F12): let the browser have them. The game takes every key press while it has
// focus, which stopped F11 from switching the page to full screen once the game loaded.
(function () {
  function pass(e) { if (e.key === 'F11' || e.key === 'F12') e.stopImmediatePropagation(); }
  window.addEventListener('keydown', pass, true);
  window.addEventListener('keyup', pass, true);
})();
</script>
<script>
// Speed: draw at most about 1600 pixels down the long side of the screen (the game's own
// layout is 1280 to 1560 tall). Very sharp phone screens would otherwise draw 2 to 3 times
// the pixels the game needs, every frame.
// Add ?hd=1 to the address to turn this off and compare, or ?px=1200 to try another limit.
(function () {
  try {
    if (location.search.indexOf('hd=1') >= 0) return;
    var real = window.devicePixelRatio || 1;
    var m = location.search.match(/[?&]px=(\d+)/);
    var limit = m ? Math.max(400, +m[1]) : 1600;
    Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () {
      var css = Math.max(window.innerWidth, window.innerHeight) || 1;
      return Math.max(1, Math.min(real, limit / css));
    } });
  } catch (e) {}
})();
</script>

// Sound: wake the game's audio on every click, tap or key (browsers only let sound

// with an iPhone's silent switch on.
(function () {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  var ctxs = [];
  ['AudioContext', 'webkitAudioContext'].forEach(function (k) {
    var O = window[k];
    if (!O) return;
    var W = function (a) { var c = new O(a); ctxs.push(c); return c; };
    W.prototype = O.prototype;
    window[k] = W;
  });
  function wake() {
    ctxs.forEach(function (c) {
      if (c.state !== 'running' && c.state !== 'closed') {
        try {
          c.resume();
          var src = c.createBufferSource();
          src.buffer = c.createBuffer(1, 1, 22050);
          src.connect(c.destination);
          src.start(0);
        } catch (e) {}
      }
    });
  }
  ['touchend', 'pointerup', 'pointerdown', 'click', 'keydown'].forEach(function (t) { document.addEventListener(t, wake, true); });
  // Matt, 28 Nov: no sound while the tab is hidden or the browser is minimised; it comes back on return
  function hush() { ctxs.forEach(function (c) { if (c.state === 'running') { try { c.suspend(); } catch (e) {} } }); }

<script id="umb-bar-js">
(function () {
  var BAR = 40;
  var d = Object.getOwnPropertyDescriptor(window, 'innerHeight') || Object.getOwnPropertyDescriptor(Window.prototype, 'innerHeight');
  var dw = Object.getOwnPropertyDescriptor(window, 'innerWidth') || Object.getOwnPropertyDescriptor(Window.prototype, 'innerWidth');
  // a phone or tablet: touch first, and a short side under 820px (no bar there, it would squash the game)
  function phone() {
    var w = dw.get.call(window), h = d.get.call(window);
    var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
    return touch && Math.min(w, h) < 820;
  }
  function wide() { return !phone() && dw.get.call(window) > d.get.call(window); }
  function mark() {
    var r = document.documentElement;
    r.classList.toggle('umb-wide', wide());
    r.classList.toggle('umb-phone', !wide());
  }
  try {
    Object.defineProperty(window, 'innerHeight', { configurable: true, get: function () {
      var h = d.get.call(window);
      return wide() ? h - BAR : h;
    } });
  } catch (e) {}
  mark();
  window.addEventListener('resize', mark);
  // after a turn, put the page back at the top-left at normal size
  window.addEventListener('orientationchange', function () { setTimeout(function () { window.scrollTo(0, 0); mark(); }, 250); });
})();

        '<div class="umb-foot">🔒 Free account. By continuing you agree to our <a href="https://umbrellasoftware.com.au/terms/" target="_blank" rel="noopener">terms</a> &amp; <a href="https://umbrellasoftware.com.au/privacy/" target="_blank" rel="noopener">privacy</a>.</div>' +
        '</div></div>');
      shield(o);
      document.body.appendChild(o);
      var box = o.querySelector('.umb-step'), card = o.querySelector('.umb-card');
      var addr = '', cool = 0, timer = null, closed = false;
      function finish(d) { if (closed) return; closed = true; clearInterval(timer); o.remove(); resolve(d); }
      async function post(path, body) {

          var r = await fetch(api + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          var j = await r.json().catch(function () { return {}; });
          return r.ok && !j.error ? j : { error: j.error || 'failed', message: j.message || 'Something went wrong. Please try again.' };

      }
      function busy(b, on) { b.disabled = on; b.classList.toggle('busy', on); }
      function fail(msg) { o.querySelector('.umb-err').textContent = msg; card.classList.remove('umb-shake'); void card.offsetWidth; card.classList.add('umb-shake'); }
      function emailStep() {
        box.innerHTML = '<ul class="umb-perks">' +
          '<li><i>✓</i><span>Everything you buy stays yours, even on a new computer or phone</span></li>' +
          '<li><i>✓</i><span>Secure payments by Stripe, and items arrive in the game instantly</span></li>' +
          '<li><i>✓</i><span>One quick code by email, then you stay signed in. No password to remember</span></li></ul>' +
          '<div class="umb-field"><input class="umb-in" type="email" inputmode="email" autocomplete="email" placeholder="Your email address" aria-label="Email address"></div>' +
          '<div class="umb-err" role="alert"></div>' +
          '<button class="umb-go" type="button"><span class="umb-t">Continue</span><span class="umb-spin"></span></button>';
        var f = box.querySelector('input'), b = box.querySelector('.umb-go');
        f.value = addr;
        async function go() {
          var v = f.value.trim();
          if (!/^\S+@\S+\.\S+$/.test(v)) return fail('Please enter your email address.');

          var r = await post('/auth/email/start', { email: v, app: app });

      }
      function codeStep() {
        var kb = document.activeElement && document.activeElement.tagName === 'INPUT';
        box.innerHTML = '<p style="margin:0 0 14px;font-size:15px;line-height:1.45;color:#3a3747">We emailed a 6-digit code to <b style="color:#1d1b26">' + esc(addr) + '</b>. It can take a minute, so check spam too.</p>' +
          '<div class="umb-field"><input class="umb-in code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="6-digit code"></div>' +
          '<div class="umb-err" role="alert"></div>' +
          '<button class="umb-go" type="button"><span class="umb-t">Sign in</span><span class="umb-spin"></span></button>' +
          '<div class="umb-row"><button class="umb-link umb-back" type="button">← Change email</button><button class="umb-link umb-again" type="button"></button></div>';

        function tick() { again.disabled = cool > 0; again.textContent = cool > 0 ? 'Resend in ' + cool + 's' : 'Resend code'; }

        timer = setInterval(function () { if (cool > 0) { cool--; tick(); } }, 1000);

          box.innerHTML = '<div class="umb-done"><div class="umb-tick">✓</div><b style="font-size:20px">You’re in!</b><p style="margin:6px 0 0;color:#6d6980;font-size:14px">Signed in as ' + esc(r.user.email) + '</p></div>';

  // Stripe's secure checkout inside a branded window. Resolves 'paid' or 'closed'.
  window.umbrellaCheckoutUI = function (pk, secret) {
    return new Promise(async function (resolve) {
      var old = document.getElementById('umb-pay'); if (old) old.remove();
      var o = el('<div id="umb-pay" class="umb-ov umb-pay" role="dialog" aria-modal="true" aria-label="Checkout"><div class="umb-card">' +
        '<button class="umb-x" type="button" aria-label="Close">✕</button>' +
        '<div class="umb-hero"><div class="umb-brand">' + LOGO + 'UmbrellaSoftware · ' + esc(game) + '</div>' +
        '<p class="umb-sub" style="margin-top:6px">🔒 Secure checkout. Your items arrive in the game the moment you pay.</p></div>' +
        '<div class="umb-pay-mount" id="umb-mount"><div class="umb-pay-load"><span></span></div></div></div></div>');

  // The signed-in account window. The add-on asks the browser's plain confirm() before signing
  // out; that box is replaced here: the confirm is answered "no" and this window opens instead,
  // and its Sign out button runs the add-on's sign-out again with the answer "yes".
  var nativeConfirm = window.confirm ? window.confirm.bind(window) : null;

      '<button class="umb-x" type="button" aria-label="Close">\u2715</button>' +
      hero('Your account', 'Everything you buy in ' + esc(game) + ' is saved to this account.') +
      '<div class="umb-body"><div class="umb-who"><div class="umb-ava">' + esc(email.charAt(0).toUpperCase()) + '</div><div><b>' + esc(email) + '</b><small>\u2713 Signed in on this device</small></div></div>' +

    shield(o);
    document.body.appendChild(o);
    var close = function () { o.remove(); };
    o.querySelector('.umb-x').onclick = close;
    o.querySelector('.umb-go').onclick = close;

      setTimeout(function () { forceYes = false; }, 3000);
    };

  // Phones: when the keyboard opens, fit our windows into the space above it and
  // keep the box being typed in visible (Matt, 29 Nov).
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    function fit() {
      var ovs = document.querySelectorAll('.umb-ov');
      for (var i = 0; i < ovs.length; i++) {

        ovs[i].style.height = vv.height + 'px';
        ovs[i].style.bottom = 'auto';

  // connect to its servers at once and fetch Stripe.js quietly once the game has started.
  ['https://js.stripe.com', 'https://api.stripe.com', 'https://m.stripe.network', 'https://pay.google.com'].forEach(function (u) {

    if (window.Stripe || document.getElementById('umb-stripe-js')) return;
    var s = document.createElement('script'); s.id = 'umb-stripe-js'; s.async = true; s.src = 'https://js.stripe.com/v3/';
    document.head.appendChild(s);
  }
  window.addEventListener('load', function () { setTimeout(warm, 4000); });
})();

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":2063036,"index.wasm":25998895},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":""};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
